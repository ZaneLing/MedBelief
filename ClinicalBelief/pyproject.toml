[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-belief-harness"
version = "0.1.0"
description = "Clinical Belief Evolution Harness: controlled study of explicit diagnostic belief states, information-gathering actions, and case-to-case evolution (DDxPlus)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.0", "matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
cbh-prepare = "scripts.prepare_data:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
